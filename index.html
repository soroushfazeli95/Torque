<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Torque">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8ECF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151E" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Torque</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column learning path of joint "nodes" zig-zagging down like a robot arm's reach; a bottom tab switches to Progress; lessons open full-screen over both. */
:root{
  --bg:#E8ECF1; --surface:#FFFFFF; --ink:#141C28; --muted:#566273; --line:#CBD3DD;
  --accent:#F2A900; --accent-deep:#C08400; --accent-soft:#FFF2CC; --accent-text:#7E5500; --accent-ink:#1C1400;
  --ok:#17936B; --ok-deep:#0F6E50; --ok-bg:#DCF2E8; --bad:#D2433A; --bad-deep:#A02D26; --bad-bg:#FBE2DF;
  --locked:#C2CAD5; --locked-deep:#A1ACBA; --flame:#E8641A;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151E; --surface:#18212D; --ink:#E7ECF2; --muted:#94A1B3; --line:#2B3747;
  --accent:#FFB81C; --accent-deep:#B07C00; --accent-soft:#33290F; --accent-text:#FFCB55; --accent-ink:#1C1400;
  --ok:#36C391; --ok-deep:#1E8A64; --ok-bg:#12332A; --bad:#FF6A5F; --bad-deep:#B8392F; --bad-bg:#3A1A18;
  --locked:#2C3848; --locked-deep:#1C2633; --flame:#FF8040; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151E; --surface:#18212D; --ink:#E7ECF2; --muted:#94A1B3; --line:#2B3747;
  --accent:#FFB81C; --accent-deep:#B07C00; --accent-soft:#33290F; --accent-text:#FFCB55; --accent-ink:#1C1400;
  --ok:#36C391; --ok-deep:#1E8A64; --ok-bg:#12332A; --bad:#FF6A5F; --bad-deep:#B8392F; --bad-bg:#3A1A18;
  --locked:#2C3848; --locked-deep:#1C2633; --flame:#FF8040; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
svg{display:block}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;color:var(--accent)}
.stats{display:flex;gap:14px;font-family:var(--mono);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:5px}
.stat svg{width:20px;height:20px}
.stat.streak svg{color:var(--flame)}
.stat.streak.off svg{color:var(--locked-deep)}
.stat.xp svg{color:var(--accent)}

main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.track{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}

/* goal */
.goal{margin-top:18px;display:grid;gap:8px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px}

/* sections */
.secs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sec{display:grid;gap:4px;align-content:start;text-align:left;padding:10px 12px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);min-width:0}
.sec .label{font-size:10.5px}
.sec b{font-family:var(--display);font-size:15px;line-height:1.2;text-wrap:balance}
.sec .row{align-items:center;margin-top:2px}
.sec .track{flex:1;height:6px}
.sec .meta{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sec[aria-pressed="true"] .label{color:var(--accent-text)}
.sechead{margin-top:22px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px)}
.sechead h2{font-family:var(--display);font-size:28px;line-height:1.1;margin:2px 0 6px;text-wrap:balance}
.sechead p{margin:0;color:var(--muted);font-size:15px;max-width:60ch}
.sgroup{display:grid;gap:10px}
.sgroup + .sgroup{margin-top:10px}
.sgroup h4{margin:6px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--display);font-size:17px}
.sgroup h4 span{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}

/* path */
.path{padding-block:8px 8px;display:grid;gap:8px}
.unit{margin-top:24px;padding:16px;border-radius:16px;background:var(--ink);color:var(--bg)}
.unit .label{color:var(--accent)}
.unit h2{font-family:var(--display);font-size:24px;line-height:1.15;margin:4px 0 4px;text-wrap:balance}
.unit p{margin:0;font-size:15px;opacity:.82}
.unit .uprog{margin-top:10px;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px}
.unit .uprog .track{flex:1;height:6px;background:color-mix(in srgb,var(--bg) 25%,transparent)}
.nodes{display:grid;gap:26px;justify-items:center;padding-block:22px 6px}
.nwrap{position:relative;display:grid;justify-items:center;gap:6px;transform:translateX(calc(var(--o) * 56px))}
.node{width:76px;height:70px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 7px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s}
.node svg{width:30px;height:30px}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--accent-deep)}
.node.locked{background:var(--locked);color:var(--locked-deep);box-shadow:0 7px 0 var(--locked-deep)}
.node.locked:active{box-shadow:0 2px 0 var(--locked-deep)}
.node.cur{outline:4px solid var(--accent-soft);outline-offset:6px}
.node.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pips{display:flex;gap:4px;margin-top:6px;min-height:8px}
.pips i{width:8px;height:8px;border-radius:2px;background:var(--line);transform:rotate(45deg)}
.pips i.on{background:var(--accent)}
.nlabel{font-size:14px;font-weight:700;color:var(--muted);text-align:center;max-width:160px;line-height:1.25}
.nwrap.done .nlabel,.nwrap.cur .nlabel{color:var(--ink)}
.tip{position:absolute;bottom:calc(100% + 10px);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;background:var(--surface);color:var(--accent-text);border:2px solid var(--line);border-radius:10px;padding:4px 12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.tip::after{content:"";position:absolute;left:50%;top:100%;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-5px) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}

.practice{margin-top:28px;width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface)}
.practice svg{width:34px;height:34px;color:var(--bad);flex:none}
.practice b{display:block;font-family:var(--display);font-size:18px}
.practice span{font-size:14px;color:var(--muted)}
.foot{padding-block:24px 16px;display:flex;justify-content:center}
.linkbtn{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;padding:8px}

/* progress view */
.pv{display:grid;gap:16px;padding-block:18px 8px}
.ptitle{font-family:var(--display);font-size:28px;margin:0;line-height:1.1}
.hero{display:grid;gap:10px}
.hero .big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hero .big small{font-size:18px;color:var(--muted);font-weight:600;margin-left:6px}
.hero .track{height:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{display:grid;gap:2px}
.kpi b{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span.sub{font-size:13px;color:var(--muted)}
.sect{display:grid;gap:10px}
.sect h3{margin:8px 0 0;font-family:var(--display);font-size:20px}
.chart{display:grid;gap:6px}
.bars{position:relative;height:130px;display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;padding-top:18px}
.bar{position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.bar i{display:block;border-radius:4px 4px 1px 1px;background:var(--accent);min-height:3px}
.bar.zero i{background:var(--line)}
.bar.today i{box-shadow:0 0 0 2px var(--ink)}
.bar em{position:absolute;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.goalline{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.55;pointer-events:none}
.goalline span{position:absolute;right:0;top:-18px;font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--surface);padding:0 3px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center}
.days .t{color:var(--ink);font-weight:700}
.focus{display:grid;gap:8px}
.frow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface)}
.frow .ft{flex:1;min-width:0}
.frow .ft b{display:block;font-size:16px}
.frow .ft span{font-size:13px;color:var(--muted)}
.chip{font-family:var(--mono);font-size:13px;font-weight:700;padding:3px 8px;border-radius:8px;font-variant-numeric:tabular-nums;flex:none}
.chip.good{background:var(--ok-bg);color:var(--ok)}
.chip.mid{background:var(--accent-soft);color:var(--accent-text)}
.chip.low{background:var(--bad-bg);color:var(--bad)}
.chip.none{background:var(--bg);color:var(--muted)}
.empty{color:var(--muted);font-size:15px;margin:0}
.ulist{display:grid;gap:10px}
.urow{display:grid;gap:8px}
.urow .row b{font-size:16px}
.urow .meta{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.urow .track{height:8px}
.lrows{display:grid;gap:2px;margin-top:2px}
.lrow{display:flex;align-items:center;gap:10px;font-size:14px;padding:4px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .nm{flex:1;min-width:0}
.lrow .dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.lrow.d .dot{background:var(--ok)}
.xfer{display:grid;gap:10px}
.xfer textarea{width:100%;box-sizing:border-box;min-width:0;font-family:var(--mono);font-size:12px;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);resize:vertical}
.xfer textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.xrow{display:flex;gap:10px}
.btn.small{min-height:44px;font-size:15px;width:auto;padding:0 18px}
.btn.ghost.small{box-shadow:none}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--locked-deep);flex:none}
.sync.cloud i{background:var(--ok)}
.sync.err i{background:var(--bad)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-block:8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border:0;background:none;border-radius:12px;color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--accent-text);background:var(--accent-soft)}

/* lesson overlay */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.lhead{padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
.lhead .wrap{display:flex;align-items:center;gap:14px;padding-block:4px 8px}
.x{background:none;border:0;padding:6px;margin-left:-6px;color:var(--muted)}
.x svg{width:24px;height:24px}
.lhead .track{flex:1;height:16px}
.batt{display:flex;align-items:center;gap:2px;padding:3px;border:2px solid var(--muted);border-radius:6px;position:relative;margin-right:4px}
.batt::after{content:"";position:absolute;right:-6px;top:50%;width:4px;height:8px;background:var(--muted);border-radius:0 2px 2px 0;transform:translateY(-50%)}
.batt i{width:6px;height:12px;border-radius:1.5px;background:var(--line)}
.batt i.on{background:var(--ok)}
.batt.low i.on{background:var(--accent)}
.batt.crit i.on{background:var(--bad)}
.lbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lbody .wrap{padding-block:16px 24px;display:grid;gap:16px}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.lt{font-family:var(--display);font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
.qt{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.25;margin:0;text-wrap:balance}
.concepts{display:grid;gap:12px}
.concept .term{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text);margin-bottom:4px}
.concept p{margin:0;font-size:16px}
.opts{display:grid;gap:10px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;background:var(--surface);font-size:17px;line-height:1.3}
.opts.tf .opt{justify-content:center;font-family:var(--display);font-weight:700;font-size:20px;padding-block:22px}
.key{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{border-color:var(--accent);color:var(--accent-text)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .key{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{border-color:var(--bad);color:var(--bad)}
.opt:disabled,.tok:disabled{cursor:default}
.slots{min-height:120px;display:flex;flex-direction:column;gap:8px;padding:12px;border:2px dashed var(--line);border-radius:14px}
.slots.right{border-color:var(--ok);border-style:solid;background:var(--ok-bg)}
.slots.wrong{border-color:var(--bad);border-style:solid;background:var(--bad-bg)}
.slots .hint{color:var(--muted);font-size:15px;margin:auto;text-align:center}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tok{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--surface);font-size:16px;line-height:1.3}
.tok .n{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent-text)}
.tok.ghost{background:var(--line);color:transparent;border-color:var(--line)}

.lfoot{border-top:2px solid var(--line);background:var(--bg);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transition:background .2s}
.lfoot .wrap{padding-block:14px 0;display:grid;gap:12px}
.lfoot.ok{background:var(--ok-bg);border-color:transparent}
.lfoot.bad{background:var(--bad-bg);border-color:transparent}
.fb h3{margin:0;font-family:var(--display);font-size:22px;display:flex;align-items:center;gap:8px}
.fb h3 svg{width:24px;height:24px}
.lfoot.ok .fb h3{color:var(--ok)}
.lfoot.bad .fb h3{color:var(--bad)}
.fb .ans{font-weight:700;margin-top:4px}
.fb p{margin:4px 0 0;font-size:15px}
.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 5px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--accent-deep)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.lfoot.ok .btn{background:var(--ok);color:#fff;box-shadow:0 5px 0 var(--ok-deep)}
.lfoot.bad .btn{background:var(--bad);color:#fff;box-shadow:0 5px 0 var(--bad-deep)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:2px solid var(--line)}

/* result */
.result{flex:1;overflow-y:auto;display:flex}
.result .wrap{margin:auto;width:100%;padding-block:32px;display:grid;gap:22px;justify-items:center;text-align:center}
.emblem{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 0 var(--accent-deep)}
.emblem.fail{background:var(--locked);color:var(--bad);box-shadow:0 8px 0 var(--locked-deep)}
.emblem svg{width:54px;height:54px}
.result h1{font-family:var(--display);font-size:32px;margin:0;line-height:1.1}
.result p{margin:-10px 0 0;color:var(--muted);max-width:34ch}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 6px}
.tile b{display:block;font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.tile span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.result .btns{display:grid;gap:12px;width:100%}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:30;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const LES={};
const convQ=q=>q[0]==="mc"?{t:"mc",q:q[1],o:q[2],a:0,ex:q[3]}:q[0]==="tf"?{t:"tf",q:q[1],a:q[2],ex:q[3]}:{t:"order",q:q[1],items:q[2],ex:q[3]};
function defLesson(id,title,learn,qs){LES[id]={id,title,learn:learn.map(([k,p])=>({k,p})),qs:qs.map(convQ)}}
function addQ(id,qs){LES[id].qs.push(...qs.map(convQ))}

/* Section 1: State estimation & SLAM */
defLesson("geo1","SO(3), SE(3) and the exp map",[
 ["Rotations","SO(3) is the group of 3×3 orthogonal matrices with det +1. 3 DOF stored in 9 numbers, so naive updates to matrix entries leave the group."],
 ["Lie algebra","so(3) is the tangent space at identity: skew-symmetric matrices ω^. Exp maps ω to a rotation by |ω| about ω/|ω| (Rodrigues)."],
 ["SE(3)","The exp of a twist (ρ, ω) is not (Exp(ω), ρ): the translation is V(ω)·ρ, where V is the left Jacobian of SO(3)."],
 ["Quaternions","Unit quaternions double-cover SO(3): q and −q are the same rotation. Interpolation and averaging must pick a consistent hemisphere."]],[
 ["mc","Dimension of SE(3) as a manifold?",["6","12","7","16"],"3 for rotation + 3 for translation. The 4×4 matrix has 16 entries but only 6 DOF."],
 ["mc","For a twist ξ = (ρ, ω), the translation part of exp(ξ^) is…",["V(ω)·ρ, with V the SO(3) left Jacobian","ρ","Exp(ω)·ρ","ρ / |ω|"],"Rotation and translation couple during integration along the screw motion."],
 ["tf","Unit quaternions q and −q represent different rotations.",false,"Double cover: same rotation. SLERP should flip one sign so the dot product is positive."],
 ["mc","Why optimise rotations via R ← R·Exp(δ) instead of updating 9 matrix entries?",["Each step stays on SO(3) with a minimal 3-parameter update","Exp is cheaper than addition","Matrices can't be differentiated","It removes the quaternion double cover"],"Minimal local parameterisation, no orthogonality constraints in the solver."],
 ["mc","Rodrigues: rotation by θ about unit axis a (K = a^) is…",["I + sinθ·K + (1 − cosθ)·K²","I + θ·K","cosθ·I + sinθ·K","I + (1 − cosθ)·K + sinθ·K²"],"The closed form of the exponential series for skew matrices."]]);
defLesson("geo2","Jacobians on manifolds",[
 ["Conventions","Right perturbation R·Exp(δ) lives in the body frame; left perturbation Exp(δ)·R in the world frame. Mixing them is a classic bug."],
 ["Adjoint","Moves perturbations between sides: T·Exp(ξ)·T⁻¹ = Exp(Ad_T ξ). For SO(3), Ad_R = R."],
 ["BCH","Exp(a)Exp(b) ≠ Exp(a + b) unless a and b commute. To first order, Log(Exp(φ)Exp(δ)) ≈ φ + J_r(φ)⁻¹δ."],
 ["Small angles","J_r(φ) → I as |φ| → 0, which is why naive additive updates seem to work for tiny rotations."]],[
 ["mc","For SO(3), the adjoint Ad_R equals…",["R","Rᵀ","I","R^"],"R·Exp(ω)·Rᵀ = Exp(Rω)."],
 ["tf","Exp(a)·Exp(b) = Exp(a + b) for all a, b in so(3).",false,"Only when they commute, e.g. parallel axes. Otherwise BCH correction terms appear."],
 ["mc","∂(R·p)/∂δ for the right perturbation R·Exp(δ), at δ = 0:",["−R·p^","−(R·p)^","R","p^"],"R(I + δ^)p = Rp + R·δ^·p = Rp − R·p^·δ."],
 ["mc","Same derivative, but with the left perturbation Exp(δ)·R:",["−(R·p)^","−R·p^","R·p^","I"],"(I + δ^)Rp = Rp − (Rp)^·δ."],
 ["mc","To first order, Log(Exp(φ)·Exp(δ)) ≈",["φ + J_r(φ)⁻¹·δ","φ + δ","φ + J_r(φ)·δ","φ − δ"],"The inverse right Jacobian maps a body-frame increment into the tangent coordinates of φ."]]);
defLesson("geo3","Multi-view geometry",[
 ["Epipolar constraint","x₂ᵀ·E·x₁ = 0 for normalised points, with E = t^·R. For pixels, F = K₂⁻ᵀ·E·K₁⁻¹."],
 ["Degrees of freedom","E has 5 DOF (scale lost), F has 7. Nistér's 5-point solver for E; 7- or 8-point for F."],
 ["PnP","Pose from 3D–2D matches. P3P gives up to 4 solutions; a 4th point disambiguates. Run inside RANSAC."],
 ["Degeneracy","Pure rotation (t = 0) makes E vanish. Use a homography instead, as ORB-SLAM's initialiser does."]],[
 ["mc","Degrees of freedom of the essential matrix?",["5","7","8","9"],"6 for pose minus 1 for unknown scale."],
 ["mc","Minimal number of correspondences for F, using the rank-2 constraint?",["7","5","8","4"],"The 7-point algorithm. 8-point is the linear version."],
 ["tf","Under pure camera rotation, the essential matrix is still well defined and recoverable.",false,"t = 0 so E = 0. The motion is described by the infinite homography K·R·K⁻¹."],
 ["mc","RANSAC with inlier ratio 0.5 and 5-point samples: probability one sample is all inliers?",["≈ 3%","≈ 50%","≈ 10%","≈ 0.5%"],"0.5⁵ = 1/32 ≈ 3.1%. You need ~145 iterations for 99% confidence."],
 ["mc","Monocular visual odometry recovers translation…",["Only up to an unknown scale","With metric scale","Not at all","Only along the optical axis"],"Scale needs another source: IMU, stereo baseline, known object size."]]);

defLesson("est1","EKF in practice",[
 ["Linearise","The mean goes through f; the covariance through the Jacobian: P ← F·P·Fᵀ + Q."],
 ["Inconsistency","Jacobians evaluated at changing estimates can create spurious information along unobservable directions (e.g. global yaw), making the filter overconfident."],
 ["FEJ","First-estimates Jacobians evaluate Jacobians at the first estimate of each state, preserving the true observability (Huang, Mourikis, Roumeliotis)."],
 ["NEES","Normalised estimation error squared, eᵀP⁻¹e, should follow χ² with n DOF. Its mean should be n."]],[
 ["mc","Covariance propagation in the EKF predict step:",["P = F·P·Fᵀ + Q","P = F·P + Q","P = Fᵀ·P·F","P = P + Q"],"Linear propagation of second moments plus process noise."],
 ["mc","Standard EKF-SLAM tends to become…",["Overconfident (inconsistent), notably in yaw","Underconfident everywhere","Exactly consistent","Unable to estimate position"],"Gains spurious yaw information from re-linearisation."],
 ["mc","FEJ fixes this by…",["Evaluating Jacobians at first estimates so the unobservable subspace is preserved","Inflating Q","Using more particles","Dropping landmarks"],"The linearised system then has the same nullspace as the nonlinear one."],
 ["mc","For a consistent filter with a 3D error state, average NEES should be about…",["3","1","0","9"],"E[χ²ₙ] = n."],
 ["tf","The Kalman gain is K = P·Hᵀ·(H·P·Hᵀ + R)⁻¹.",true,"Innovation covariance S = HPHᵀ + R."]]);
defLesson("est2","UKF and particle filters",[
 ["Sigma points","The UKF pushes 2n + 1 deterministic points through the nonlinearity. No Jacobians; better than first-order accuracy for the mean."],
 ["Particle filter","Weighted samples represent arbitrary, multimodal beliefs. Suited to global localisation and the kidnapped-robot problem."],
 ["Degeneracy","Weight concentrates on a few particles. Effective sample size N_eff = 1/Σwᵢ² triggers resampling."],
 ["Dimensionality","Particles needed grow exponentially with state dimension. Rao–Blackwellisation (FastSLAM) handles part of the state analytically."]],[
 ["mc","Number of sigma points in a standard UKF with n-dimensional state?",["2n + 1","n","n²","2ⁿ"],"One at the mean plus ± along each principal axis."],
 ["mc","100 particles, all weight on one particle. N_eff = 1/Σwᵢ² equals…",["1","100","0","50"],"Σwᵢ² = 1. Uniform weights would give 100."],
 ["mc","FastSLAM samples the robot path and keeps, per particle,…",["Independent EKFs for each landmark","One global EKF","Particles for each landmark","A factor graph"],"Conditioned on the path, landmarks are independent."],
 ["tf","The UKF requires analytic Jacobians of the process model.",false,"It uses deterministic sampling instead."],
 ["mc","Best suited to global localisation with a strongly multimodal belief:",["Particle filter","EKF","UKF","Information filter"],"Gaussian filters represent one mode."]]);
defLesson("est3","Error-state Kalman filters",[
 ["Nominal + error","The ESKF integrates a nominal state with full nonlinear IMU kinematics and filters a small error state."],
 ["Why","The error stays near zero, so linearisation is accurate, and attitude error is a minimal 3-vector. No unit-norm constraint in the covariance."],
 ["Reset","After each update, inject the error into the nominal state and reset the error to zero, with a covariance reset Jacobian."],
 ["IMU model","ω_m = ω + b_g + n_g;  a_m = Rᵀ(a − g) + b_a + n_a. Biases are random walks."]],[
 ["mc","Dimension of the attitude error in an ESKF:",["3","4","9","1"],"Minimal tangent-space representation."],
 ["mc","Main reason to use an error-state over a full-state quaternion EKF:",["The small, minimal error state keeps linearisation accurate","Fewer IMU readings","No need for biases","Global yaw becomes observable"],"Also avoids a singular 4×4 quaternion covariance."],
 ["tf","An accelerometer at rest measures zero.",false,"It measures specific force: about 9.81 m/s² opposing gravity."],
 ["mc","IMU biases are commonly modelled as…",["Random walks","Constants from the datasheet","White noise only","Sinusoids"],"Allan variance gives the random-walk density."],
 ["order","Order one ESKF cycle.",["Propagate nominal state with IMU","Propagate error covariance","Update error state with a measurement","Inject error and reset"],"Predict, update, inject, reset."]]);

defLesson("fg1","SLAM as least squares",[
 ["MAP","With Gaussian noise, MAP estimation minimises Σ‖rᵢ(x)‖² in the Mahalanobis norm of each Σᵢ."],
 ["Factor graph","Variables (poses, landmarks) and factors (measurements). Graph structure equals Hessian sparsity."],
 ["Smoothing vs filtering","Smoothing keeps and re-linearises past states. Filtering marginalises them and freezes their linearisation."],
 ["Gauge freedom","Without a prior, the solution is defined only up to a global transform. Fix the first pose or add a prior."]],[
 ["mc","With Gaussian noise, the MAP estimate minimises…",["The sum of squared Mahalanobis residuals","The sum of absolute residuals","The largest residual","The number of outliers"],"−log of a Gaussian is a quadratic form."],
 ["mc","Pose-graph SLAM with no prior has a singular Hessian because of…",["Gauge freedom","Too many loop closures","Outliers","Odometry noise"],"Relative measurements can't fix the absolute frame."],
 ["tf","Marginalisation in a filter fixes the linearisation point of past states.",true,"This is the root of filter inconsistency and why sliding-window methods use FEJ."],
 ["mc","Marginalising a pose out of a factor graph tends to…",["Create fill-in: a dense factor among its neighbours","Remove all factors","Make the problem linear","Delete landmarks"],"The Schur complement connects everything the pose touched."],
 ["mc","The sparsity of the information matrix JᵀΣ⁻¹J mirrors…",["The graph's connectivity","The image resolution","The iteration count","The robot's speed"],"Non-zero block (i, j) iff a factor links i and j."]]);
defLesson("fg2","Solvers and sparsity",[
 ["Gauss–Newton","Solve (JᵀJ)Δ = −Jᵀr. Fast near the optimum, can diverge from a poor guess."],
 ["Levenberg–Marquardt","(JᵀJ + λI)Δ = −Jᵀr. Large λ → small gradient steps; small λ → Gauss–Newton."],
 ["Schur complement","In bundle adjustment, eliminate the block-diagonal landmark part first, leaving a small reduced camera system."],
 ["Ordering","Variable ordering (e.g. COLAMD) controls fill-in during sparse Cholesky."]],[
 ["mc","In LM, increasing λ makes the step behave more like…",["Gradient descent with a small step","Gauss–Newton","Newton's method","Random search"],"λ is a trust-region knob."],
 ["mc","In bundle adjustment, which block is eliminated first via the Schur complement?",["Landmarks","Cameras","Intrinsics","Loop closures"],"Landmark block is block-diagonal, cheap to invert."],
 ["tf","Gauss–Newton approximates the Hessian by JᵀJ, ignoring second-order residual terms.",true,"Good when residuals are small at the solution."],
 ["mc","Variable ordering matters because it controls…",["Fill-in during factorisation","Measurement noise","Number of landmarks","Loop closure detection"],"Bad orderings can turn sparse problems dense."],
 ["mc","BA with 10 cameras (6 DOF) and 10,000 points (3 DOF): size of the reduced camera system?",["60 × 60","30,060 × 30,060","30,000 × 30,000","10 × 10"],"After eliminating 30,000 point variables, 60 camera variables remain."]]);
defLesson("fg3","Robust and incremental",[
 ["Outliers","One wrong loop closure can wreck a least-squares map. Robust kernels down-weight large residuals."],
 ["IRLS","Robust costs are solved as iteratively reweighted least squares."],
 ["GNC","Graduated non-convexity starts from a convex surrogate and gradually morphs it into the robust cost."],
 ["iSAM2","The Bayes tree allows incremental updates, re-linearising only affected variables (fluid relinearisation)."]],[
 ["mc","The Huber loss is…",["Quadratic near zero, linear for large residuals","Linear everywhere","Constant for large residuals","Cubic"],"Bounded influence, still convex."],
 ["mc","For very large residuals, the Cauchy kernel's influence…",["Goes to zero (redescending)","Stays constant","Grows linearly","Grows quadratically"],"ψ(r) = r/(1 + r²/c²) → 0."],
 ["tf","Redescending kernels are convex, so they need no good initial guess.",false,"They are non-convex, hence GNC or good initialisation."],
 ["mc","iSAM2's core data structure is the…",["Bayes tree","k-d tree","Octree","Quadtree"],"Derived from the elimination of the factor graph."],
 ["mc","GNC works by…",["Solving a sequence from a convex surrogate to the true robust cost","Adding more outliers","Linearising once","Random restarts"],"Continuation avoids poor local minima."]]);

defLesson("vio1","IMU preintegration",[
 ["Problem","In optimisation-based VIO, re-integrating IMU data between keyframes at every linearisation is expensive."],
 ["Preintegration","Integrate between keyframes in the first keyframe's body frame, independent of its pose and velocity: ΔR, Δv, Δp."],
 ["Bias updates","Small bias changes use first-order Jacobian corrections instead of re-integration (Forster et al., on-manifold)."],
 ["Gravity","Gravity is added back in the residual; the preintegrated terms exclude it."]],[
 ["mc","Preintegrated measurements are independent of…",["The pose and velocity at keyframe i","The IMU biases","Gravity","IMU noise"],"That is the whole point: linearisation of state i doesn't require re-integration."],
 ["mc","When the bias estimate changes slightly, preintegration…",["Applies a first-order Jacobian correction","Re-integrates everything","Ignores it","Drops the factor"],"Re-integrate only if the change is large."],
 ["tf","The preintegrated Δp already contains the effect of gravity.",false,"Gravity is handled in the residual using the global gravity vector."],
 ["mc","Preintegration lets you…",["Add one IMU factor between keyframes in a factor graph","Skip bias estimation","Skip camera measurements","Get metric scale without motion"],"Hundreds of IMU samples become one factor."],
 ["mc","ΔR_ij is built as…",["The product of Exp((ω̃ₖ − b_g)·Δt) over samples","A sum of angular rates","An average quaternion","An integral of acceleration"],"Rotations compose multiplicatively."]]);
defLesson("vio2","VIO observability",[
 ["Unobservable","VIO has 4 unobservable DOF: global position (3) and yaw about gravity (1). Roll and pitch are observable via gravity."],
 ["Scale","Monocular + IMU makes metric scale observable, but only with enough acceleration."],
 ["Degenerate motion","Constant velocity, or planar motion with constant acceleration, can render scale unobservable."],
 ["Initialisation","Recover gravity, velocity, scale and gyro bias by aligning up-to-scale visual SfM with preintegrated IMU (e.g. VINS-Mono)."]],[
 ["mc","How many unobservable DOF does VIO have?",["4","6","3","7"],"x, y, z and yaw."],
 ["mc","Which are observable in VIO?",["Roll and pitch","Global yaw","Global x position","All 6 DOF"],"The gravity direction pins them."],
 ["tf","A vehicle at constant velocity in a straight line gives enough IMU excitation to observe scale.",false,"No acceleration, no scale information."],
 ["mc","Ground vehicles running monocular VIO often suffer from…",["Scale drift from low excitation","Too much excitation","Unobservable gravity","Too many features"],"Wheel odometry is often added for this reason."],
 ["mc","Typical VIO initialisation first solves…",["Up-to-scale visual SfM, then aligns it with the IMU","Full BA with IMU from scratch","GPS alignment","LiDAR scan matching"],"Loosely coupled init, then tightly coupled optimisation."]]);
defLesson("vio3","Neural scene representations",[
 ["NeRF","An MLP maps a 3D point and view direction to density and colour. Images come from volume rendering along rays."],
 ["3D Gaussian splatting","Millions of anisotropic Gaussians (position, covariance, opacity, spherical-harmonic colour), rasterised by splatting in real time (Kerbl et al. 2023)."],
 ["Optimisation","Both use photometric loss on posed images. 3DGS adds adaptive densification (clone/split) and pruning."],
 ["Robotics uses","Photorealistic sensor simulation, dense SLAM (SplaTAM, MonoGS) and digital twins for closed-loop testing."]],[
 ["mc","3D Gaussian splatting renders by…",["Rasterising projected Gaussians with alpha blending","Ray marching an MLP","Ray tracing triangles","Voxel lookup"],"Sorted tile-based rasterisation on GPU."],
 ["mc","A NeRF's MLP outputs…",["Density and view-dependent colour","Depth only","Semantic labels only","Normals only"],"Colour is integrated along each ray, weighted by transmittance."],
 ["tf","3DGS stores view-dependent colour with spherical-harmonic coefficients per Gaussian.",true,"Usually up to degree 3."],
 ["mc","Main practical advantage of 3DGS over the original NeRF:",["Real-time rendering","No need for camera poses","Always smaller storage","Works without images"],"Storage is often larger than NeRF, not smaller."],
 ["mc","Under-reconstructed regions in 3DGS are handled by…",["Cloning and splitting Gaussians","Adding MLP layers","Lowering resolution","Removing views"],"Triggered by large view-space positional gradients."]]);

/* Section 2: Optimal control & planning */
defLesson("oc1","LQR",[
 ["Problem","Linear dynamics x' = Ax + Bu and quadratic cost Σ xᵀQx + uᵀRu. The optimal policy is linear: u = −Kx."],
 ["Riccati","Finite horizon: backward Riccati recursion for Pₜ. Infinite horizon: solve the algebraic Riccati equation (DARE/CARE)."],
 ["Discrete gain","K = (R + BᵀPB)⁻¹·BᵀPA."],
 ["Tuning","Larger Q penalises state error (aggressive); larger R penalises effort (gentle). Only their ratio affects K."]],[
 ["mc","The optimal LQR policy is…",["Linear state feedback u = −Kx","Bang-bang","Open loop","Quadratic in x"],"Value function is quadratic, so the minimiser is linear."],
 ["mc","Discrete-time LQR gain:",["K = (R + BᵀPB)⁻¹BᵀPA","K = R⁻¹BᵀP","K = PBR","K = (Q + AᵀPA)⁻¹"],"R⁻¹BᵀP is the continuous-time form."],
 ["tf","Scaling Q and R by the same positive factor changes the optimal gain.",false,"P scales too and K is unchanged."],
 ["mc","Increasing R relative to Q makes the controller…",["Use less effort and respond more slowly","More aggressive","Unstable","Unchanged"],"Effort becomes expensive."],
 ["mc","Finite-horizon LQR computes Pₜ by…",["Backward recursion from the terminal cost","Forward simulation","Gradient descent","Sampling"],"Dynamic programming."]]);
defLesson("oc2","iLQR and DDP",[
 ["Idea","Around a nominal trajectory, linearise dynamics, quadratise cost, solve an LQR-like backward pass, roll out forward, repeat."],
 ["Backward pass","Produces feedforward kₜ and feedback Kₜ: u = ū + α·k + K(x − x̄)."],
 ["DDP vs iLQR","DDP uses second-order dynamics derivatives; iLQR drops them (Gauss–Newton-like) and is cheaper per iteration."],
 ["Robustness","A line search on α and Levenberg-style regularisation of Q_uu keep each iteration a descent step."]],[
 ["mc","iLQR differs from DDP by…",["Ignoring second-order dynamics terms","Using sampling","Having no backward pass","Only handling linear systems"],"Tensor terms f_xx, f_uu, f_ux are dropped."],
 ["mc","In u = ū + α·k + K(x − x̄), α is…",["The line-search step on the feedforward term","A discount factor","A learning rate of a network","An exploration parameter"],"Shrink α until the cost decreases."],
 ["tf","Vanilla iLQR natively handles hard state inequality constraints.",false,"Needs augmented Lagrangian (e.g. ALTRO) or barrier terms."],
 ["mc","If Q_uu isn't positive definite in the backward pass, a common fix is…",["Add regularisation μI and retry","Skip the iteration","Flip its sign","Lengthen the horizon"],"Increase μ until the Cholesky succeeds."],
 ["mc","iLQR is a…",["Shooting method: controls are decision variables, states come from rollouts","Collocation method","Sampling-based planner","Graph search"],"Every iterate is dynamically feasible."]]);
defLesson("oc3","Direct trajectory optimisation",[
 ["Indirect","Pontryagin: derive optimality conditions, then solve a two-point boundary-value problem. Accurate but sensitive to costate guesses."],
 ["Single shooting","Optimise controls; get states by simulation. Few variables, poorly conditioned for long or unstable horizons."],
 ["Multiple shooting","Split the horizon, add continuity (defect) constraints. Better conditioning; parallelisable."],
 ["Collocation","States and controls are both decision variables; dynamics enforced at collocation points (e.g. Hermite–Simpson). Solved with IPOPT or SNOPT."]],[
 ["mc","Which method treats states and controls as variables with dynamics as constraints?",["Direct collocation","Single shooting","Indirect method","LQR"],"Simultaneous approach."],
 ["mc","Main benefit of multiple over single shooting for unstable systems:",["Better numerical conditioning","Fewer variables","No constraints","Guaranteed global optimum"],"Errors can't blow up across the full horizon."],
 ["tf","Collocation can be initialised with a dynamically infeasible guess.",true,"For example a straight-line interpolation in state space."],
 ["mc","Indirect methods are notoriously sensitive to…",["The initial guess of the costates","Cost weights","Number of controls","Time step only"],"Costates have no physical intuition."],
 ["mc","IPOPT is…",["An interior-point NLP solver","A physics engine","A path planner","A Kalman filter"],"Widely used via CasADi."]]);

defLesson("mpc1","Linear MPC design",[
 ["Receding horizon","Solve a finite-horizon problem, apply the first input, shift, re-solve."],
 ["QP","Linear model + quadratic cost + linear constraints = QP. Solvers: OSQP, qpOASES, HPIPM."],
 ["Stability","A terminal cost (e.g. LQR's P) with a terminal invariant set gives recursive feasibility and stability."],
 ["Soft constraints","Slack variables with large penalties prevent infeasibility when disturbances push states past limits."]],[
 ["mc","Linear MPC with box constraints is solved as a…",["QP","LP","MILP","SDP"],"Quadratic cost, linear constraints."],
 ["mc","A common terminal cost for stability is…",["The LQR value function xᵀPx","Zero","Twice the stage cost","A log barrier"],"Makes the finite horizon mimic the infinite one near the origin."],
 ["tf","Without terminal ingredients, long horizons often stabilise in practice, but guarantees are weaker.",true,"Results exist for sufficiently long horizons, with conditions."],
 ["mc","Why soften state constraints with slacks?",["To avoid infeasible QPs under disturbances","To speed up the plant","To remove the horizon","To linearise dynamics"],"Input constraints stay hard; they're physical."],
 ["mc","Recursive feasibility means…",["Feasible now implies feasible at the next step","One-iteration convergence","Cost reaches zero","All constraints are linear"],"Shifted previous solution plus terminal controller proves it."]]);
defLesson("mpc2","Nonlinear MPC in real time",[

/* ---------- state ---------- */
function dayStr(d=new Date()){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function yest(){const d=new Date();d.setDate(d.getDate()-1);return dayStr(d)}
function fresh(){return{v:2,L:{},xp:0,streak:0,bestStreak:0,last:null,days:{},mist:[],updated:0}}
let S=fresh();
try{
 const r=localStorage.getItem(KEY);
 if(r)S=Object.assign(fresh(),JSON.parse(r));
 else{const o=localStorage.getItem("torque.v1");if(o){const d=JSON.parse(o);
  Object.keys(d.done||{}).forEach(id=>S.L[id]={done:true,best:null,runs:1,r:0,w:0});
  S.xp=d.xp||0;S.streak=d.streak||0;S.bestStreak=d.streak||0;S.last=d.last||null;S.mist=d.mist||[];
  if(d.today)S.days[d.today]=d.todayXp||0;S.updated=Date.now()}}
}catch(e){}
const lst=id=>S.L[id]||(S.L[id]={done:false,best:null,runs:0,r:0,w:0});
const isDone=id=>!!(S.L[id]&&S.L[id].done);
const liveStreak=()=>(S.last===dayStr()||S.last===yest())?S.streak:0;
const todayXp=()=>S.days[dayStr()]||0;
function clean(){S.mist=(S.mist||[]).filter(k=>{const[id,i]=k.split(":");return BYID[id]&&BYID[id].qs[+i]})}
clean();
let SEC=0;try{const v=parseInt(localStorage.getItem("torque.sec"),10);if(v>=0&&v<SECTIONS.length)SEC=v}catch(e){}

/* sync: local cache + private per-user doc in the artifact db */
let REF=null,syncState="local",writing=false,again=false,syncTimer=null;
function save(){
 S.updated=Date.now();
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 clearTimeout(syncTimer);syncTimer=setTimeout(push,800);
}
function push(){
 if(!REF)return;if(writing){again=true;return}
 writing=true;
 REF.set(JSON.parse(JSON.stringify(S))).then(()=>{syncState="cloud"}).catch(()=>{syncState="err"})
  .finally(()=>{writing=false;paintSync();if(again){again=false;push()}});
}
function merge(a,b){
 const m=fresh();
 const ids=new Set([...Object.keys(a.L||{}),...Object.keys(b.L||{})]);
 ids.forEach(id=>{const x=(a.L||{})[id]||{},y=(b.L||{})[id]||{};
  const bests=[x.best,y.best].filter(v=>typeof v==="number");
  m.L[id]={done:!!(x.done||y.done),best:bests.length?Math.max(...bests):null,runs:Math.max(x.runs||0,y.runs||0),r:Math.max(x.r||0,y.r||0),w:Math.max(x.w||0,y.w||0)}});
 m.xp=Math.max(a.xp||0,b.xp||0);
 const days=new Set([...Object.keys(a.days||{}),...Object.keys(b.days||{})]);
 days.forEach(d=>m.days[d]=Math.max((a.days||{})[d]||0,(b.days||{})[d]||0));
 const newer=(a.updated||0)>=(b.updated||0)?a:b;
 m.streak=newer.streak||0;m.last=newer.last||null;m.mist=(newer.mist||[]).slice();
 m.bestStreak=Math.max(a.bestStreak||0,b.bestStreak||0,m.streak);
 m.updated=Math.max(a.updated||0,b.updated||0);
 return m;
}
async function initSync(){
 try{
  if(!window.claude||!window.claude.use)return;
  const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const ref=db.doc("data/users/"+id+"/progress");
  const snap=await Promise.race([ref.get(),new Promise((_,rj)=>setTimeout(()=>rj(new Error("timeout")),10000))]);
  REF=ref;
  const remote=snap.exists?snap.data():null;
  if(remote){S=merge(S,remote);clean();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  syncState="cloud";render();push();
 }catch(e){syncState="err";paintSync()}
}

const pct=(r,w)=>r+w?Math.round(r/(r+w)*100):null;
const chipCls=p=>p==null?"none":p>=85?"good":p>=65?"mid":"low";
const stars=b=>b==null?0:b>=90?3:b>=70?2:1;

   ${S.mist.length?`<button class="practice" id="practice2" style="margin-top:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><div><b>Practice mistakes</b><span>${S.mist.length} question${S.mist.length===1?"":"s"} to review</span></div></button>`:""}
  </section>
  <section class="sect"><h3>By section</h3><div class="ulist">`;
 SECTIONS.forEach((sec,si)=>{
  h+=`<div class="sgroup"><h4>${si+1}. ${sec.title}<span>${secDone(si)}/${secTotal(si)}</span></h4>`;
  UNITS.forEach((u,ui)=>{
   if(u.si!==si)return;
   let r=0,w=0;u.lessons.forEach(l=>{const s=S.L[l.id];if(s){r+=s.r||0;w+=s.w||0}});
   const dn=u.lessons.filter(l=>isDone(l.id)).length,p=pct(r,w);
   h+=`<div class="card urow"><div class="row"><b>${ui+1}. ${u.title}</b><span class="meta">${dn}/${u.lessons.length} · ${p==null?"no answers":p+"% right"}</span></div><div class="track"><i style="width:${dn/u.lessons.length*100}%"></i></div><div class="lrows">${u.lessons.map(l=>{const s=S.L[l.id]||{};const b=s.best;return`<div class="lrow${isDone(l.id)?" d":""}"><span class="dot"></span><span class="nm">${l.title}</span>${isDone(l.id)?`<span class="chip ${chipCls(b)}">${b==null?"done":"best "+b+"%"}</span>`:`<span class="chip none">${(s.r||s.w)?"started":"–"}</span>`}</div>`}).join("")}</div></div>`;
  });
  h+=`</div>`;
 });
 h+=`</div></section>
  <section class="sect"><h3>Move your progress</h3>
   <div class="card xfer">
    <p class="empty">Copy a progress code here, then paste it into Torque on another device or in the standalone app. Progress is merged, never lost.</p>
    <div class="xrow"><button class="btn small" id="xCopy">Copy progress code</button></div>
    <label class="label" for="xIn">Paste a progress code</label>
    <textarea id="xIn" rows="3" spellcheck="false" placeholder="TQ1…"></textarea>
    <div class="xrow"><button class="btn small ghost" id="xImport">Import progress</button></div>
   </div>
  </section>
  <div class="sync ${syncState==="cloud"?"cloud":syncState==="err"?"err":""}" id="syncLine"><i></i><span></span></div></div>`;
 $("#progressView").innerHTML=h;paintSync();
}
function paintSync(){
 const el=$("#syncLine");if(!el)return;
 el.className="sync "+(syncState==="cloud"?"cloud":syncState==="err"?"err":"");
 el.querySelector("span").textContent=syncState==="cloud"?"Progress saved to your Claude account":syncState==="err"?"Couldn't reach your account. Progress is saved on this device.":"Progress saved on this device";
}
function progressCode(){return "TQ1"+btoa(unescape(encodeURIComponent(JSON.stringify(S))))}
function readCode(t){t=(t||"").trim();if(!t.startsWith("TQ1"))throw new Error("bad");const o=JSON.parse(decodeURIComponent(escape(atob(t.slice(3)))));if(!o||typeof o!=="object"||!o.L)throw new Error("bad");return o}
$("#progressView").addEventListener("click",e=>{
 if(e.target.closest("#xCopy")){const code=progressCode(),ta=$("#xIn");
  const fallback=()=>{ta.value=code;ta.focus();ta.select();toast("Code selected. Copy it from the box.")};
  try{navigator.clipboard.writeText(code).then(()=>toast("Progress code copied"),fallback)}catch(x){fallback()}return}
 if(e.target.closest("#xImport")){try{const o=readCode($("#xIn").value);S=merge(S,o);clean();save();render();toast("Progress imported")}catch(x){toast("That code isn't valid. Copy it again and paste the whole thing.")}return}
 const f=e.target.closest(".frow");if(f){const l=BYID[f.dataset.id];if(unlocked(l.id))startLesson(l);else toast("That lesson is still locked");return}
 if(e.target.closest("#practice2"))startReview();
});

/* ---------- tabs ---------- */
let TAB="learn";
function setTab(t){
 TAB=t;$("#learnView").hidden=t!=="learn";$("#progressView").hidden=t!=="progress";
 $("#tabLearn").setAttribute("aria-selected",t==="learn");$("#tabProg").setAttribute("aria-selected",t==="progress");
 if(location.hash!=="#"+t){try{location.hash=t}catch(e){}}
 render();window.scrollTo(0,0);
}
$("#tabLearn").addEventListener("click",()=>setTab("learn"));
$("#tabProg").addEventListener("click",()=>setTab("progress"));
window.addEventListener("hashchange",()=>setTab(location.hash==="#progress"?"progress":"learn"));
function render(){renderHeader();if(TAB==="learn")renderLearn();else renderProgress()}

let rt;$("#reset").addEventListener("click",e=>{
 const b=e.currentTarget;
 if(b.dataset.arm){S=fresh();save();render();b.textContent="Reset progress";delete b.dataset.arm;toast("Progress reset");return}
 b.dataset.arm=1;b.textContent="Tap again to erase all progress";clearTimeout(rt);
 rt=setTimeout(()=>{b.textContent="Reset progress";delete b.dataset.arm},3500);
});

/* ---------- lesson engine ---------- */
let L=null;
function startLesson(l){
 const items=l.qs.map((q,i)=>({key:l.id+":"+i,q}));
 L={review:false,id:l.id,title:l.title,ui:l.ui,learn:l.learn,queue:items,total:items.length,correct:0,wrong:0,battery:CELLS,phase:isDone(l.id)?"q":"learn",seenLearn:false};
 openLesson();
}
function startReview(){
 const items=shuffle(S.mist).slice(0,8).map(k=>{const[id,i]=k.split(":");const l=BYID[id];return l&&l.qs[+i]?{key:k,q:l.qs[+i]}:null}).filter(Boolean);
 if(!items.length){S.mist=[];save();render();return}
 L={review:true,title:"Practice mistakes",ui:null,learn:[],queue:items,total:items.length,correct:0,wrong:0,battery:CELLS,phase:"q"};
 openLesson();
}
function openLesson(){$("#lesson").hidden=false;$("#result").hidden=true;document.documentElement.style.overflow="hidden";renderStep()}
function closeAll(){$("#lesson").hidden=true;$("#result").hidden=true;document.documentElement.style.overflow="";L=null;render()}
$("#quit").addEventListener("click",closeAll);

function updHead(){
 $("#lbar").style.width=(L.correct/L.total*100)+"%";
 const b=$("#batt");b.className="batt"+(L.battery<=1?" crit":L.battery<=2?" low":"");
 b.setAttribute("aria-label","Battery "+L.battery+" of "+CELLS);
 b.innerHTML=Array.from({length:CELLS},(_,i)=>`<i class="${i<L.battery?"on":""}"></i>`).join("");
}
const TL={mc:"Choose the answer",tf:"True or false",order:"Put in order"};
function renderStep(){
 const body=$("#lbody"),go=$("#go");$("#lfoot").className="lfoot";$("#fb").hidden=true;updHead();
 if(L.phase==="learn"){
  L.mode="learn";
  body.innerHTML=`<div class="wrap"><div class="eyebrow">Unit ${String(L.ui+1).padStart(2,"0")} · New concepts</div><h1 class="lt">${L.title}</h1><div class="concepts">${L.learn.map(c=>`<article class="card concept"><div class="term">${c.k}</div><p>${c.p}</p></article>`).join("")}</div></div>`;
  go.disabled=false;go.textContent="Start questions";body.scrollTop=0;return;
 }
 const q=L.queue[0].q;L.mode="check";L.sel=null;go.textContent="Check";go.disabled=true;
 let h=`<div class="wrap"><div class="eyebrow">${L.review?"Review · ":""}${TL[q.t]}</div><h1 class="qt">${q.q}</h1>`;
 if(q.t==="mc"){L.opts=shuffle(q.o.map((t,i)=>({t,c:i===q.a})));h+=`<div class="opts">${L.opts.map((o,i)=>`<button class="opt" data-k="${i}"><span class="key">${"ABCD"[i]}</span><span>${o.t}</span></button>`).join("")}</div>`}
 else if(q.t==="tf"){L.opts=[{t:"True",c:q.a===true},{t:"False",c:q.a===false}];h+=`<div class="opts tf">${L.opts.map((o,i)=>`<button class="opt" data-k="${i}">${o.t}</button>`).join("")}</div>`}
 else{const idx=q.items.map((_,i)=>i);let b;do{b=shuffle(idx)}while(b.every((v,i)=>v===i)&&idx.length>1);L.bank=b;L.pick=[];h+=`<div class="slots" id="slots"></div><div class="bank" id="bank"></div>`}
 if(!L.review&&L.learn.length&&isDone(L.id))h+=`<button class="linkbtn" id="showLearn" style="justify-self:start;padding-left:0">Review the concepts</button>`;
 body.innerHTML=h+"</div>";body.scrollTop=0;
 if(q.t==="order")renderOrder();
}
function renderOrder(lock){
 const q=L.queue[0].q;
 $("#slots").innerHTML=L.pick.length?L.pick.map((ix,n)=>`<button class="tok" data-from="slot" data-ix="${ix}" ${lock?"disabled":""}><span class="n">${n+1}</span>${q.items[ix]}</button>`).join(""):'<span class="hint">Tap the items below in the right order</span>';
 $("#bank").innerHTML=L.bank.map(ix=>{const u=L.pick.includes(ix);return`<button class="tok${u?" ghost":""}" data-from="bank" data-ix="${ix}" ${u||lock?"disabled":""}${u?' tabindex="-1" aria-hidden="true"':""}>${q.items[ix]}</button>`}).join("");
}
$("#lbody").addEventListener("click",e=>{
 if(!L)return;
 if(e.target.closest("#showLearn")){L.phase="learn";renderStep();return}
 if(L.mode!=="check")return;
 const o=e.target.closest(".opt");
 if(o){L.sel=+o.dataset.k;document.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===o));$("#go").disabled=false;return}
 const t=e.target.closest(".tok");
 if(t){const ix=+t.dataset.ix;if(t.dataset.from==="bank"){if(!L.pick.includes(ix))L.pick.push(ix)}else L.pick=L.pick.filter(v=>v!==ix);renderOrder();$("#go").disabled=L.pick.length!==L.queue[0].q.items.length}
});
$("#go").addEventListener("click",()=>{if(!L)return;if(L.mode==="learn"){L.phase="q";renderStep()}else if(L.mode==="check")check();else if(L.mode==="next")next()});

function check(){
 const item=L.queue[0],q=item.q;let ok,ans;
 if(q.t==="order"){ok=L.pick.every((ix,n)=>ix===n);ans=q.items.join(" → ");renderOrder(true);$("#slots").classList.add(ok?"right":"wrong")}
 else{ok=L.opts[L.sel].c;ans=L.opts.find(o=>o.c).t;document.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;x.classList.remove("sel");if(L.opts[i].c)x.classList.add("right");else if(i===L.sel)x.classList.add("wrong")})}
 const s=lst(item.key.split(":")[0]);
 if(ok){L.correct++;s.r++;L.queue.shift();S.mist=S.mist.filter(k=>k!==item.key)}
 else{L.wrong++;s.w++;L.battery--;if(!S.mist.includes(item.key))S.mist.push(item.key);L.queue.push(L.queue.shift())}
 save();updHead();
 const praise=["Correct","Nice work","Exactly right","Spot on"];
 const fb=$("#fb");fb.hidden=false;
 fb.innerHTML=`<h3>${ok?IC.check:IC.x}${ok?praise[Math.floor(Math.random()*praise.length)]:"Not quite"}</h3>${ok?"":`<div class="ans">Answer: ${ans}</div>`}<p>${q.ex}</p>`;
 $("#lfoot").className="lfoot "+(ok?"ok":"bad");
 L.mode="next";$("#go").textContent="Continue";$("#go").focus({preventScroll:true});
}
function next(){if(L.battery<=0)fail();else if(!L.queue.length)finish();else renderStep()}

function showResult(html){$("#lesson").hidden=true;$("#result").hidden=false;$("#resultBody").innerHTML=html}
function finish(){
 const perfect=L.wrong===0,gain=L.review?L.total*2:10+(perfect?5:0);
 const acc=Math.round(L.total/(L.total+L.wrong)*100);
 S.xp+=gain;const t=dayStr();S.days[t]=(S.days[t]||0)+gain;
 if(S.last!==t){S.streak=S.last===yest()?S.streak+1:1;S.last=t}
 S.bestStreak=Math.max(S.bestStreak||0,S.streak);
 let prevBest=null,firstTime=false;
 if(!L.review){const s=lst(L.id);prevBest=s.best;firstTime=!s.done;s.done=true;s.runs=(s.runs||0)+1;s.best=Math.max(s.best??0,acc)}
 save();
 const all=!L.review&&ALL.every(l=>isDone(l.id));
 const newBest=!L.review&&!firstTime&&prevBest!=null&&acc>prevBest;
 const msg=all?"You finished every unit. Replay lessons to raise your stars.":perfect?"Perfect run, no mistakes. +5 bonus XP.":newBest?"New personal best on this lesson.":"Missed questions are saved for practice.";
 showResult(`<div class="emblem">${IC.check}</div><h1>${all?"Course complete":L.review?"Review done":"Lesson complete"}</h1><p>${msg}</p>
 <div class="tiles"><div class="tile"><b>+${gain}</b><span>XP</span></div><div class="tile"><b>${acc}%</b><span>Accuracy</span></div><div class="tile"><b>${S.streak}</b><span>Day streak</span></div></div>
 <div class="btns"><button class="btn" id="rDone">Continue</button><button class="btn ghost" id="rProg">See progress</button></div>`);
 $("#rDone").addEventListener("click",()=>{closeAll()});
 $("#rProg").addEventListener("click",()=>{closeAll();setTab("progress")});
 $("#rDone").focus();
}
function fail(){
 const src=L.review?null:BYID[L.id];
 showResult(`<div class="emblem fail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10.5v3" stroke-linecap="round"/><path d="M6 10v4" stroke-linecap="round"/></svg></div><h1>Battery drained</h1><p>You ran out of charge this time. The questions you missed are saved for practice.</p>
 <div class="btns"><button class="btn" id="rAgain">Try again</button><button class="btn ghost" id="rBack">Back to path</button></div>`);
 $("#rAgain").addEventListener("click",()=>{if(src)startLesson(src);else startReview()});
 $("#rBack").addEventListener("click",closeAll);
}

TAB=location.hash==="#progress"?"progress":"learn";
setTab(TAB);
initSync();
try{if("serviceWorker" in navigator&&window.top===window&&location.protocol==="https:"&&!/claude\.ai|claudeusercontent/.test(location.host))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
</script>

</body></html>
